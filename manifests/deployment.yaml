apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: us-central1-docker.pkg.dev/harsha-gcp-505210/argo-cd-demo/nginx-app:latest
          ports:
            - containerPort: 80
