name: Kubernetes CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: harsha-gcp-505210
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: argo-cd-demo
  IMAGE_NAME: nginx-app

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1004730610900/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-ci@harsha-gcp-505210.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" | \
          docker login -u oauth2accesstoken \
          --password-stdin https://${GAR_LOCATION}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -t ${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}
